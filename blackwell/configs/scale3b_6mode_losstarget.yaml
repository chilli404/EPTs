run_name: scale3b_6mode_losstarget
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 24
  d_model: 3072
  n_head: 32
  ctx_len: 1024
  execution_mode: sequential
batch_seqs: 8
train:
  bf16_params: true
  steps: 12000
  matrix_lr: 0.001
  embed_lr: 0.005
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 1000
  dense_until: 50
  batch_size: 16
execution_training:
  enabled: true
  gradient_checkpointing: true
  parallel_weight: 0.5
  consistency_weight: 0.1
  consistency_loss_target: 0.0014
  cw_control_every: 20
  cw_control_gain: 0.25
  cw_control_max_step: 1.2
  cw_control_ema: 0.9
  cw_control_max: 10000.0
  strategy: random_mask_6mode
  mode_probabilities:
    sequential: 0.167
    parallel: 0.167
    skip: 0.167
    reverse: 0.167
    attn_only: 0.166
    ffn_only: 0.166
checkpointing:
  ckpt_every: 3000
  dense_windows: []
