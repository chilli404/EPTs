run_name: scale3b_poly_full
wandb_project: execution-polymorphism

model:
  vocab_size: 8192
  n_layer: 24
  d_model: 3072
  n_head: 32
  ctx_len: 1024
  execution_mode: sequential

batch_seqs: 8

train:
  steps: 12000
  matrix_lr: 0.0005
  embed_lr: 0.002
  weight_decay: 0.0
  warmdown_frac: 0.3
  bf16_params: true

data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100_000_000

probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 32

execution_training:
  enabled: true
  parallel_weight: 0.5
  consistency_weight: 0.1
  memory_efficient: false

checkpointing:
  ckpt_every: 1000
  dense_windows: []
