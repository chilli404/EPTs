run_name: scale1b_6mode_lt_ramp
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 28
  d_model: 1536
  n_head: 24
  ctx_len: 1024
  execution_mode: sequential
batch_seqs: 4
train:
  bf16_params: true
  steps: 12000
  matrix_lr: 0.0015
  embed_lr: 0.008
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 32
execution_training:
  enabled: true
  strategy: random_mask_6mode
  consistency_weight: 0.1
  mode_probabilities:
    sequential: 0.167
    parallel: 0.167
    skip: 0.167
    reverse: 0.167
    attn_only: 0.166
    ffn_only: 0.166
  memory_efficient: true
  consistency_loss_target: 0.0014
  cw_control_every: 20
  cw_control_gain: 0.5
  cw_control_max_step: 1.2
  cw_control_max: 300.0
  consistency_loss_target_start: 0.14
  consistency_loss_target_frac: 0.5
checkpointing:
  ckpt_every: 1000
  dense_windows: []
