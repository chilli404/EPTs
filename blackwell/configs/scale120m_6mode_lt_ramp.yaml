run_name: scale120m_6mode_lt_ramp
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 12
  d_model: 704
  n_head: 8
  ctx_len: 1024
  execution_mode: sequential
batch_seqs: 16
train:
  steps: 3500
  matrix_lr: 0.005
  embed_lr: 0.02
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 57500000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 250
  dense_until: 0
  batch_size: 128
execution_training:
  enabled: true
  strategy: random_mask_6mode
  consistency_weight: 1.0
  mode_probabilities:
    sequential: 0.167
    parallel: 0.167
    skip: 0.167
    reverse: 0.167
    attn_only: 0.166
    ffn_only: 0.166
  consistency_loss_target: 0.0009
  cw_control_every: 20
  cw_control_gain: 0.5
  cw_control_max_step: 1.3
  cw_control_max: 300.0
  consistency_loss_target_start: 0.09
  consistency_loss_target_frac: 0.5
checkpointing:
  ckpt_every: 1000
  dense_windows: []
