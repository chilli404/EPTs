run_name: scale430m_6mode_gradnorm_seqw075_masks3
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 20
  d_model: 1152
  n_head: 18
  ctx_len: 1024
  execution_mode: sequential
batch_seqs: 8
train:
  steps: 12000
  matrix_lr: 0.002
  embed_lr: 0.01
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 64
execution_training:
  enabled: true
  strategy: random_mask_6mode
  mode_probabilities:
    sequential: 0.3
    parallel: 0.3
    skip: 0.1
    reverse: 0.15
    attn_only: 0.075
    ffn_only: 0.075
  gradnorm_rho: 0.2
  sequential_weight: 0.75
  masks_per_step: 3
checkpointing:
  ckpt_every: 1000
  dense_windows: []
