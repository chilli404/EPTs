run_name: scale430m_llama_ternary_losstarget
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 20
  d_model: 1152
  n_head: 18
  ctx_len: 1024
  execution_mode: sequential
  norm_type: rmsnorm
  mlp_type: swiglu
  use_value_embeddings: false
  logit_softcap: 0.0
batch_seqs: 8
train:
  steps: 12000
  matrix_lr: 0.002
  embed_lr: 0.01
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 64
execution_training:
  enabled: true
  strategy: random_mask_consistent
  parallel_probability: 0.4
  skip_probability: 0.2
  consistency_weight: 1.0
  consistency_loss_target: 0.005
  cw_control_every: 20
  cw_control_gain: 0.25
  cw_control_max_step: 1.3
  cw_control_max: 10000.0
  cw_control_ema: 0.9
checkpointing:
  ckpt_every: 1000
  dense_windows: []
