wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 28
  d_model: 1536
  n_head: 24
  ctx_len: 1024
  execution_mode: sequential
  norm_type: rmsnorm
  mlp_type: swiglu
  use_value_embeddings: false
  logit_softcap: 0.0
batch_seqs: 16
train:
  bf16_params: true
  steps: 12000
  matrix_lr: 0.0015
  embed_lr: 0.008
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 32
checkpointing:
  ckpt_every: 3000
  dense_windows: []
run_name: scale1b_llama_lt_reachable
execution_training:
  enabled: true
  gradient_checkpointing: true
  parallel_weight: 0.5
  consistency_weight: 0.1
  consistency_loss_target: 0.02
  cw_control_every: 20
  cw_control_gain: 0.25
  cw_control_max_step: 1.2
  cw_control_max: 5.0
  cw_control_ema: 0.9
