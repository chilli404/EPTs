run_name: scale430m_poly_smoke
wandb_project: execution-polymorphism

model:
  vocab_size: 8192
  n_layer: 20
  d_model: 1152
  n_head: 18
  ctx_len: 1024
  execution_mode: sequential

batch_seqs: 8

train:
  steps: 20
  matrix_lr: 0.002
  embed_lr: 0.01
  weight_decay: 0.0
  warmdown_frac: 0.3

data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 10_000_000

probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 20
  dense_until: 0
  batch_size: 64

execution_training:
  enabled: true
  parallel_weight: 0.5
  consistency_weight: 1.0

checkpointing:
  ckpt_every: 20
  dense_windows: []
