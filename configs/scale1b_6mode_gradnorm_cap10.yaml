batch_seqs: 4
checkpointing:
  ckpt_every: 1000
  dense_windows: []
data:
  max_tokens: 100000000
  shard_dir: data/climbmix/bpe8192/shards
  tokenizer_dir: data/climbmix/bpe8192
execution_training:
  enabled: true
  gradnorm_rho: 0.2
  gradnorm_cw_max: 10.0
  mode_probabilities:
    attn_only: 0.075
    ffn_only: 0.075
    parallel: 0.3
    reverse: 0.15
    sequential: 0.3
    skip: 0.1
  strategy: random_mask_6mode
  gradient_checkpointing: true
model:
  ctx_len: 1024
  d_model: 1536
  execution_mode: sequential
  n_head: 24
  n_layer: 28
  vocab_size: 8192
probes:
  batch_size: 32
  battery_path: data/probes/v1/battery.jsonl
  dense_until: 50
  every: 500
run_name: scale1b_6mode_gradnorm_cap10
seed: 42
train:
  bf16_params: true
  embed_lr: 0.008
  matrix_lr: 0.0015
  steps: 12000
  warmdown_frac: 0.3
  weight_decay: 0.0
wandb_project: execution-polymorphism
