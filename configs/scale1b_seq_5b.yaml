run_name: scale1b_seq_5b
wandb_project: execution-polymorphism

model:
  vocab_size: 8192
  n_layer: 28
  d_model: 1536
  n_head: 24
  ctx_len: 1024
  execution_mode: sequential

batch_seqs: 16

train:
  steps: 305000
  matrix_lr: 0.0015
  embed_lr: 0.008
  weight_decay: 0.0
  warmdown_frac: 0.3

data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards_10b
  max_tokens: 5_000_000_000

probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 10000
  dense_until: 50
  batch_size: 32

checkpointing:
  ckpt_every: 50000
  dense_windows: []
