run_name: scale1b_poly_cw01
wandb_project: execution-polymorphism

model:
  vocab_size: 8192
  n_layer: 28
  d_model: 1536
  n_head: 24
  ctx_len: 1024
  execution_mode: sequential

batch_seqs: 8

train:
  steps: 12000
  matrix_lr: 0.0015
  embed_lr: 0.008
  weight_decay: 0.0
  warmdown_frac: 0.3

data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100_000_000

probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 500
  dense_until: 50
  batch_size: 32

execution_training:
  enabled: true
  parallel_weight: 0.5
  consistency_weight: 0.1

checkpointing:
  ckpt_every: 6000
  dense_windows: []
