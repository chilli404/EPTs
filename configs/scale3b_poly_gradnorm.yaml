run_name: scale3b_poly_gradnorm
wandb_project: execution-polymorphism
model:
  vocab_size: 8192
  n_layer: 24
  d_model: 3072
  n_head: 32
  ctx_len: 1024
  execution_mode: sequential
batch_seqs: 8
train:
  bf16_params: true
  steps: 12000
  matrix_lr: 0.001
  embed_lr: 0.005
  weight_decay: 0.0
  warmdown_frac: 0.3
data:
  tokenizer_dir: data/climbmix/bpe8192
  shard_dir: data/climbmix/bpe8192/shards
  max_tokens: 100000000
probes:
  battery_path: data/probes/v1/battery.jsonl
  every: 1000
  dense_until: 50
  batch_size: 16
execution_training:
  enabled: true
  parallel_weight: 0.5
  gradnorm_rho: 0.2
  memory_efficient: false
checkpointing:
  ckpt_every: 3000
  dense_windows: []
