[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execution-graph-transformers"
version = "0.1.0"
description = "Learning and compiling execution-graph equivalent Transformers"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "matplotlib",
    "mlflow",
    "numpy",
    "pyyaml",
    "safetensors",
    "scipy",
    "tokenizers",
    "torch>=2.4",
    "transformers>=4.45,<6",
]

[project.optional-dependencies]
dev = ["jupyter", "nbconvert", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/fogen"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
